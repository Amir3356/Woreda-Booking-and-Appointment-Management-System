// Catalog API served by department-service over gRPC (internal network only).
// Other services use it instead of reading the departments/services tables directly.
syntax = "proto3";

package woreda.catalog.v1;

option go_package = "github.com/woreda/booking/proto/gen/woreda/catalog/v1;catalogv1";

service CatalogService {
  // GetService returns one public service together with the department that delivers it.
  // NOT_FOUND when no service has that id.
  rpc GetService(GetServiceRequest) returns (GetServiceResponse);
}

message GetServiceRequest {
  string service_id = 1;
}

message GetServiceResponse {
  Service service = 1;
  Department department = 2;
}

message Service {
  string id = 1;
  string department_id = 2;
  string code = 3;
  string name = 4;
  int32 duration_minutes = 5;
  int32 daily_quota = 6;
  repeated string required_documents = 7;
  bool is_active = 8;
}

message Department {
  string id = 1;
  string code = 2;
  string name = 3;
  string building_room = 4;
  string contact_phone = 5;
  bool is_active = 6;
}
