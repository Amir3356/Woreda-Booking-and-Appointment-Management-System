# Edge proxy in front of the api-gateway. Its job here is rate limiting: it rejects excessive
# requests with 429 before they reach any Go service.
#
# Limits are per client IP. If many citizens share one public IP (an office or kiosk behind NAT),
# raise the rates below.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # --- Rate limiting -------------------------------------------------------------------------
    # General API traffic: 5 requests/second per IP (300/min), with bursts of up to 50 allowed.
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m  rate=5r/s;
    # Sign-in and sign-up: 20/min per IP, to slow down password guessing and spam accounts.
    # (auth-service additionally locks an email after 5 wrong passwords.)
    limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=20r/m;
    # At most 30 open connections per IP.
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    limit_req_status  429;
    limit_conn_status 429;
    limit_req_log_level warn;

    client_max_body_size 2m;

    # --- Proxy to the gateway ------------------------------------------------------------------
    # Docker's DNS. `resolve` re-looks-up the gateway, so a rebuilt gateway container (new IP)
    # is picked up without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream api_gateway {
        zone api_gateway 64k;
        server api-gateway:8080 resolve;
        keepalive 32;
    }

    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    # Overwrite (not append) so a client cannot fake its address in these headers.
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    server {
        listen 80;

        # Same JSON envelope as the Go services. CORS headers are added so the browser shows the
        # 429 to the frontend instead of reporting a CORS failure (the body holds no user data).
        error_page 429 = @too_many_requests;
        location @too_many_requests {
            default_type application/json;
            add_header Access-Control-Allow-Origin      $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Vary                             Origin always;
            add_header Retry-After                      60 always;
            return 429 '{"success":false,"message":"Too many requests. Please slow down and try again later.","error":{"code":"RATE_LIMIT_EXCEEDED","details":[]}}';
        }

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Live updates for open pages (WebSocket). A proxy_set_header here replaces all the
        # http-level ones, so they are repeated. Long timeout: the gateway pings every 25s.
        location = /api/v1/ws {
            limit_req  zone=api_per_ip burst=50 nodelay;
            limit_conn conn_per_ip 30;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_pass http://api_gateway;
        }

        location ~ ^/api/v1/auth/(login|register)$ {
            limit_req  zone=auth_per_ip burst=10 nodelay;
            limit_req  zone=api_per_ip  burst=50 nodelay;
            limit_conn conn_per_ip 30;
            proxy_pass http://api_gateway;
        }

        location / {
            limit_req  zone=api_per_ip burst=50 nodelay;
            limit_conn conn_per_ip 30;
            proxy_pass http://api_gateway;
        }
    }
}
