# Prometheus: scrapes the six WoredaCare services and the infrastructure exporters every 15 s.
# Everything is on the Docker "backend" network; only Prometheus (127.0.0.1:9090) and
# Grafana (127.0.0.1:3001) are published, on this machine only.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Each service serves /metrics on its internal port 9464 (config/metrics.js), with label service=<name>.
  - job_name: woreda-services
    static_configs:
      - targets:
          - api-gateway:9464
          - auth-service:9464
          - user-service:9464
          - department-service:9464
          - appointment-service:9464
          - booking-service:9464

  - job_name: mongodb
    static_configs:
      - targets: ["mongodb-exporter:9216"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"] # node-exporter runs on the host network

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
