# WoredaCare — local development stack
#   docker compose up --build
# Frontend (client/) runs separately with `npm run dev` and talks to the gateway:
#   VITE_API_BASE_URL=http://localhost:8080/api/v1

name: woreda-booking

x-service-env: &service-env
  MONGO_URL: mongodb://mongo:27017/woreda?replicaSet=rs0
  TZ: Africa/Addis_Ababa # "today" for bookings and the desk queue
  JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [backend]
  depends_on:
    mongo:
      condition: service_healthy

services:
  # Database: single-node replica set (rs0) so multi-document transactions work.
  # department-service creates the departments and user-service the administrator and
  # default settings on startup when they are missing.
  # Published on localhost only, for mongosh/Compass:
  #   mongodb://localhost:27017/woreda?directConnection=true
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # First run initiates the replica set; healthy once this node is the writable primary.
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }; if (!db.hello().isWritablePrimary) quit(1)"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Cache only (cached API responses, revoked tokens, login-failure counters): no persistence needed.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  # Event streaming: appointment lifecycle events (topic woreda.appointments).
  # Single broker in KRaft mode (no ZooKeeper), internal to the backend network.
  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 168 # keep 7 days of events
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks: [backend]

  # One-shot: creates the topics, then exits.
  #   woreda.appointments: appointment lifecycle (3 partitions, keyed by appointment ID)
  #   woreda.catalog:      department/service changes (1 partition: low volume, global order)
  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic woreda.appointments --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic woreda.catalog --partitions 1 --replication-factor 1
    restart: "no"
    networks: [backend]

  # Public entry point: rate limits requests (server/nginx/nginx.conf), then proxies to the gateway.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # Mount the folder, not the file: editors replace the file on save (new inode), and a
    # single-file bind mount would keep serving the old copy.
    volumes:
      - ./server/nginx:/etc/nginx/woreda:ro
    command: ["nginx", "-c", "/etc/nginx/woreda/nginx.conf", "-g", "daemon off;"]
    ports:
      - "8080:80"
    depends_on:
      - api-gateway
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend]

  api-gateway:
    build: ./server/api-gateway
    restart: unless-stopped
    environment:
      PORT: "8080"
      REDIS_URL: redis://redis:6379/0
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      DEPARTMENT_SERVICE_URL: http://department-service:8083
      APPOINTMENT_SERVICE_URL: http://appointment-service:8084
      BOOKING_SERVICE_URL: http://booking-service:8085
    expose:
      - "8080" # reached only through nginx
    depends_on:
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      department-service:
        condition: service_started
      appointment-service:
        condition: service_started
      booking-service:
        condition: service_started
    networks: [backend]

  auth-service:
    <<: *service-defaults
    build: ./server/auth-service
    environment:
      <<: *service-env
      PORT: "8081"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  user-service:
    <<: *service-defaults
    build: ./server/user-service
    environment:
      <<: *service-env
      PORT: "8082"

  department-service:
    <<: *service-defaults
    build: ./server/department-service
    environment:
      <<: *service-env
      PORT: "8083"
      GRPC_PORT: "9083" # internal catalog API (gRPC), not published
      KAFKA_BROKERS: kafka:9092 # publishes catalog changes (woreda.catalog)
    depends_on:
      mongo:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  appointment-service:
    <<: *service-defaults
    build: ./server/appointment-service
    environment:
      <<: *service-env
      PORT: "8084"
      KAFKA_BROKERS: kafka:9092
      CATALOG_GRPC_ADDR: department-service:9083
    depends_on:
      mongo:
        condition: service_healthy
      department-service:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  booking-service:
    <<: *service-defaults
    build: ./server/booking-service
    environment:
      <<: *service-env
      PORT: "8085"
      KAFKA_BROKERS: kafka:9092
    depends_on:
      mongo:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------------------------
  # Monitoring (server/monitoring/): Prometheus collects metrics, Grafana shows them.
  #   Grafana     http://localhost:3001  (no sign-in)
  #   Prometheus  http://localhost:9090
  # Every service serves /metrics on its internal port 9464 (never through nginx); the exporters
  # below translate MongoDB, Redis, Kafka and nginx statistics into Prometheus metrics.
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    extra_hosts:
      - "host.docker.internal:host-gateway" # node-exporter on the host (172.17.0.1:9100)
    volumes:
      - ./server/monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [backend]

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    environment:
      # No sign-in: every visitor is let in as an administrator. Safe only because the port is
      # published on 127.0.0.1 (this machine); add a login back before exposing it on a network.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_NAME: Main Org.
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_DISABLE_SIGNOUT_MENU: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_USERS_DEFAULT_THEME: dark
      # The overview dashboard's sidebar and diagram are HTML text panels (local-only Grafana).
      GF_PANELS_DISABLE_SANITIZE_HTML: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/overview.json
    volumes:
      - ./server/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./server/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    networks: [backend]

  mongodb-exporter:
    image: percona/mongodb_exporter:0.42.0
    restart: unless-stopped
    command:
      - --mongodb.uri=mongodb://mongo:27017/?directConnection=true
      - --collector.diagnosticdata
      - --compatible-mode
    depends_on:
      mongo:
        condition: service_healthy
    networks: [backend]

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks: [backend]

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    restart: unless-stopped
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka:
        condition: service_healthy
    networks: [backend]

  # Host CPU, memory, disk and network (the gauges on the overview dashboard). It runs on the host
  # network to see the real network cards, but listens only on Docker's bridge address
  # (172.17.0.1), so it is reachable from the containers and this machine, not from the LAN.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --web.listen-address=172.17.0.1:9100
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)
      - --collector.netdev.device-exclude=^(lo|veth.*|docker.*|br-.*)$$
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    restart: unless-stopped
    command: ["--nginx.scrape-uri=http://nginx:8081/stub_status"]
    depends_on:
      - nginx
    networks: [backend]

volumes:
  mongo-data:
  kafka-data:
  prometheus-data:
  grafana-data:

networks:
  backend:
